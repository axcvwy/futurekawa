[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "I", "B", "SIM", "DTZ", "S", "RUF"]
ignore = [
    "B008",   # Depends()/Header() en valeur par défaut : idiome FastAPI accepté
    "BLE001", # except Exception : volontaire pour ne jamais casser l'ingestion MQTT
    "DTZ003", # datetime.utcnow() conservé par compatibilité
    "DTZ011",
    "S101",   # assert autorisé dans les tests
    "S110",   # except sans action (ex : STARTTLS optionnel)
    "SIM105", # try/except/pass explicite : STARTTLS optionnel
    "RUF001", # tirets longs (–) : typographie française volontaire
    "RUF002",
    "RUF003",
    "S105",   # values de test utilisées comme littéraux (token_type, mdp) 
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "E501"]
"app/config.py" = ["E402"]
"app/__init__.py" = ["E402"]
"app/models/__init__.py" = ["F401"]
"app/routes/__init__.py" = ["F401"]